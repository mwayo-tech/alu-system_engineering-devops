<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceci n'est pas une page</title>
  <style>
    :root {
      --sky-top: #6faee6;
      --sky-bottom: #dcecf9;
      --ground: #14213d;
      --ground-ink: #f1f5f9;
      --door: #f4c04e;
      --door-shade: #d9a232;
      --frame: #0d1730;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      grid-template-rows: minmax(300px, 62vh) 1fr;
      background: var(--ground);
      color: var(--ground-ink);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* ---------- Sky ---------- */
    .sky {
      position: relative;
      background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 999px;
      opacity: .9;
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud::before { width: 55%; height: 160%; left: 12%; bottom: 30%; }
    .cloud::after  { width: 40%; height: 130%; right: 14%; bottom: 25%; }

    .c1 { width: 150px; height: 34px; top: 14%; left: -200px; animation-duration: 70s; }
    .c2 { width: 100px; height: 24px; top: 32%; left: -200px; animation-duration: 95s; animation-delay: -40s; opacity: .75; }
    .c3 { width: 190px; height: 40px; top: 20%; left: -200px; animation-duration: 120s; animation-delay: -85s; opacity: .8; }

    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 400px)); }
    }

    /* ---------- Door ---------- */
    .door-stage {
      position: relative;
      perspective: 900px;
      z-index: 2;
    }

    .door-button {
      display: block;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
      border-radius: 6px 6px 0 0;
    }
    .door-button:focus-visible {
      outline: 4px solid #ffffff;
      outline-offset: 6px;
    }

    .frame {
      display: block;
      position: relative;
      width: clamp(120px, 22vw, 170px);
      aspect-ratio: 9 / 16;
      border: 10px solid var(--frame);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(to bottom, #3f86d4, #a9d0f2);
    }

    .inside {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: .04em;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(13, 23, 48, .35);
    }

    .panel {
      position: absolute;
      inset: 0;
      background: var(--door);
      border-radius: 2px;
      transform-origin: left center;
      transition: transform 1.1s cubic-bezier(.3, .7, .2, 1);
      box-shadow: inset 0 0 0 6px var(--door-shade);
    }
    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      left: 16%;
      right: 16%;
      border: 3px solid var(--door-shade);
      border-radius: 3px;
    }
    .panel::before { top: 9%;  height: 34%; }
    .panel::after  { bottom: 9%; height: 34%; }

    .knob {
      position: absolute;
      right: 11%;
      top: 52%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--frame);
      z-index: 1;
    }

    .door-button[aria-pressed="true"] .panel {
      transform: rotateY(-108deg);
    }

    /* ---------- Horizon & ground ---------- */
    .ground {
      padding: clamp(1.5rem, 4vw, 3rem) 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
    }

    .code {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: .95rem;
      color: #aab6cc;
      letter-spacing: .02em;
    }

    h1 {
      font-size: clamp(1.9rem, 6vw, 3.1rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1.15;
      max-width: 20ch;
    }

    .lede {
      max-width: 46ch;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #d4dcea;
    }

    .home {
      margin-top: .5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      color: var(--frame);
      background: var(--door);
      text-decoration: none;
      padding: .75rem 1.5rem;
      border-radius: 999px;
      transition: transform .2s ease, background .2s ease;
    }
    .home:hover { background: #ffd36e; transform: translateY(-2px); }
    .home:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }

    .hint {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: .85rem;
      color: #8d9ab3;
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud { animation: none; left: 20%; }
      .c2 { left: 60%; }
      .c3 { left: 75%; }
      .panel { transition: none; }
      .home { transition: none; }
    }
  </style>
</head>
<body>
  <div class="sky">
    <div class="cloud c1" aria-hidden="true"></div>
    <div class="cloud c2" aria-hidden="true"></div>
    <div class="cloud c3" aria-hidden="true"></div>
    <div class="door-stage">
      <button class="door-button" type="button" aria-pressed="false" aria-label="Open the door">
        <span class="frame">
          <span class="inside" id="inside">404</span>
          <span class="panel"><span class="knob"></span></span>
        </span>
      </button>
    </div>
  </div>

  <main class="ground">
    <p class="code">Erreur 404 · Error 404</p>
    <h1>Ceci n'est pas une page.</h1>
    <p class="lede">
      Nothing lives at this address. The door in the sky only leads to more sky.
    </p>
    <a class="home" href="/">Back to the homepage</a>
    <p class="hint">You can open the door if you like.</p>
  </main>

  <script>
    const door = document.querySelector('.door-button');
    const inside = document.getElementById('inside');
    door.addEventListener('click', () => {
      const open = door.getAttribute('aria-pressed') === 'true';
      door.setAttribute('aria-pressed', String(!open));
      door.setAttribute('aria-label', open ? 'Open the door' : 'Close the door');
      inside.textContent = open ? '404' : 'Rien.';
    });
  </script>
</body>
</html>
